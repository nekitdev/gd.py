[tool.poetry]
name = "gd.py"
version = "2.0.0-dev.0"
description = "An API wrapper for Geometry Dash written in Python."
authors = ["nekitdev"]
license = "MIT"

include = ["gd/submodules"]

readme = "README.md"

homepage = "https://github.com/nekitdev/gd.py"
repository = "https://github.com/nekitdev/gd.py"
documentation = "https://nekitdev.github.io/gd.py"

keywords = ["python", "gd"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[tool.poetry.urls]
Chat = "https://nekit.dev/chat"
Funding = "https://nekit.dev/funding"
Issues = "https://github.com/nekitdev/gd.py/issues"

[[tool.poetry.packages]]
include = "gd"

[tool.poetry.scripts]
gd = "gd.main:gd"

[tool.poetry.dependencies]
python = ">= 3.8"

aiohttp = ">= 3.9.5"
click = ">= 8.1.7"
tqdm = ">= 4.66.4"
yarl = ">= 1.9.4"

attrs = ">= 23.2.0"
cattrs = ">= 23.2.3"

pendulum = ">= 3.0.0"

entrypoint = ">= 2.1.0"
versions = ">= 2.1.2"

named = ">= 1.4.2"

xor-cipher = ">= 5.0.0"
colors-core = ">= 1.1.1"

async-extensions = ">= 4.0.0"
iters = ">= 0.18.0"

funcs = ">= 0.10.1"
wraps = ">= 0.13.0"

typing-extensions = ">= 4.12.2"
typing-aliases = ">= 1.10.1"

pycapnp = ">= 2.0.0"

[tool.poetry.dependencies.lxml]
version = ">= 5.2.2"
optional = true

[tool.poetry.dependencies.pillow]
version = ">= 10.3.0"
optional = true

[tool.poetry.dependencies.cryptography]
version = ">= 42.0.8"
optional = true

[tool.poetry.dependencies.ipython]
version = ">= 8.25.0"
python = ">= 3.10"
optional = true

[tool.poetry.extras]
crypto = ["cryptography"]
image = ["pillow"]
speed = ["lxml"]
console = ["ipython"]

[tool.poetry.group.format.dependencies]
ruff = "0.4.10"

[tool.poetry.group.check.dependencies]
mypy = "1.10.1"

types-pillow = "10.2.0.20240520"
types-tqdm = "4.66.0.20240417"
lxml-stubs = "0.5.1"

[tool.poetry.group.check.dependencies.pre-commit]
version = "3.7.1"
python = ">= 3.9"

[tool.poetry.group.test.dependencies]
coverage = "7.5.4"
pytest = "8.2.2"
pytest-cov = "5.0.0"
pytest-asyncio = "0.23.7"
hypothesis = "6.104.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "1.6.0"
mkdocs-material = "9.5.27"

[tool.poetry.group.docs.dependencies.mkdocstrings]
version = "0.25.1"
extras = ["python"]

[tool.poetry.group.release]
optional = true

[tool.poetry.group.release.dependencies]
changelogging = "2.3.0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E402",  # module level import not at top of file
    "E741",  # ambiguous variable name
    "F402",  # import module from line shadowed by loop variable
]

[tool.pytest.ini_options]
addopts = "--cov gd"
testpaths = ["tests"]

[tool.coverage.run]
source = ["gd"]

[tool.coverage.report]
ignore_errors = true
exclude_also = [
    "pragma: never",
    "pragma: no cover",
    "if TYPE_CHECKING",
    "@overload",
    "@required",
    "raise NotImplementedError",
    "raise AssertionError",
    "def __repr__",
]

[tool.coverage.html]
directory = "coverage"

[tool.mypy]
strict = true

[tool.changelogging.context]
name = "gd.py"
version = "2.0.0-dev.0"
url = "https://github.com/nekitdev/gd.py"

[tool.changelogging.formats]
title = "[{{version}}]({{url}}/tree/v{{version}}) ({{date}})"
fragment = "{{content}} ([#{{id}}]({{url}}/pull/{{id}}))"

[build-system]
requires = ["poetry-core >= 1.9.0"]
build-backend = "poetry.core.masonry.api"
